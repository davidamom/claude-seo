name: Sync fork with upstream

# Keeps this fork (davidamom/claude-seo) in sync with upstream
# (AgriciDaniel/claude-seo) automatically, preserving the fork's own commits.
# Runs daily; can also be triggered manually from the Actions tab.
# On a merge conflict the run fails and GitHub notifies you — resolve it locally.

on:
  schedule:
    - cron: '0 6 * * *'   # daily, 06:00 UTC (03:00 BRT)
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Register `merge=ours` driver (required by .gitattributes)
        # The driver is a security-sensitive setting that lives in local git
        # config (never in the committed tree). Without this, paths pinned in
        # .gitattributes via `merge=ours` fall back to the default 3-way
        # merge and conflicts on those paths fail the workflow.
        run: git config merge.ours.driver true

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/AgriciDaniel/claude-seo.git || true
          git fetch upstream

      - name: Merge upstream/main (preserving fork commits)
        run: git merge upstream/main --no-edit

      - name: Keep fork-owned workflow files
        # GITHUB_TOKEN nunca pode criar/alterar arquivos de workflow no push
        # ("refusing to allow a GitHub App to ... without workflows permission").
        # Foi isso que travou o sync diario de 20/07 a 17/08/2026, quando o
        # upstream alterou ci.yml/v2.yml. Se o merge trouxer mudanca em
        # .github/workflows, mantemos a versao do fork e avisamos: essas
        # mudancas entram por merge manual (credencial de usuario) quando valer.
        run: |
          if ! git diff --quiet origin/main HEAD -- .github/workflows/; then
            echo "::warning::Upstream alterou .github/workflows; mantida a versao do fork. Sincronize os workflows manualmente (git push de usuario) se quiser as mudancas."
            git checkout origin/main -- .github/workflows/
            git commit -m "sync: keep fork-owned .github/workflows (GITHUB_TOKEN nao empurra workflow)"
          fi

      - name: Push to fork
        run: git push origin main
