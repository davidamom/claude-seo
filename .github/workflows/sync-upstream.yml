name: Sync fork with upstream

# Keeps this fork (davidamom/claude-seo) in sync with upstream
# (AgriciDaniel/claude-seo) automatically, preserving the fork's own commits.
# Runs daily; can also be triggered manually from the Actions tab.
# On a merge conflict the run fails and GitHub notifies you — resolve it locally.

on:
  schedule:
    - cron: '0 6 * * *'   # daily, 06:00 UTC (03:00 BRT)
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Register `merge=ours` driver (required by .gitattributes)
        # The driver is a security-sensitive setting that lives in local git
        # config (never in the committed tree). Without this, paths pinned in
        # .gitattributes via `merge=ours` fall back to the default 3-way
        # merge and conflicts on those paths fail the workflow.
        run: git config merge.ours.driver true

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/AgriciDaniel/claude-seo.git || true
          git fetch upstream

      - name: Merge upstream/main (preserving fork commits, workflows fork-owned)
        # GITHUB_TOKEN nunca pode criar/alterar arquivos de workflow no push
        # ("refusing to allow a GitHub App to ... without workflows permission").
        # Travou o sync de 20/07 a 17/08/2026 (upstream alterou ci.yml/v2.yml), de
        # 27/08 a 28/09/2026 (upstream ADICIONOU windows-smoke.yml) e em 29-30/09/2026
        # (upstream MODIFICOU windows-smoke.yml, que o fork apagou: conflito
        # modify/delete faz `git merge` sair com codigo 1 antes da limpeza, e o
        # driver merge=ours nao cobre conflito de delecao). Por isso o merge e feito
        # SEM commit e tolerando conflito: conflitos em .github/workflows sao
        # resolvidos a favor do fork (versao do fork, ou remocao se o fork nao tem o
        # arquivo); conflito fora dos workflows aborta o merge e falha o job.
        # Mudancas de workflow do upstream entram por merge manual (push de usuario).
        run: |
          git merge upstream/main --no-commit --no-edit || echo "merge com conflitos; resolvendo workflows fork-owned"
          unmerged=$(git diff --name-only --diff-filter=U)
          for f in $unmerged; do
            case "$f" in
              .github/workflows/*)
                if git cat-file -e "origin/main:$f" 2>/dev/null; then
                  git checkout origin/main -- "$f"
                else
                  echo "::warning::Workflow $f nao existe no fork (fork-owned): mantido removido"
                  git rm -q --cached -- "$f"; rm -f "$f"
                fi ;;
              *)
                echo "::error::Conflito fora de .github/workflows em $f; resolver manualmente (git push de usuario)"
                git merge --abort; exit 1 ;;
            esac
          done
          git checkout origin/main -- .github/workflows/
          added=$(git diff --cached --name-only --diff-filter=A origin/main -- .github/workflows/)
          if [ -n "$added" ]; then
            echo "::warning::Upstream adicionou workflow(s) nao trazidos (fork-owned): $added"
            for f in $added; do git rm -q --cached -- "$f"; rm -f "$f"; done
          fi
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::Ainda ha caminhos nao mergeados"; git status --short; exit 1
          fi
          if ! git diff --quiet upstream/main -- .github/workflows/; then
            echo "::warning::Workflows do fork divergem do upstream; sincronize manualmente (git push de usuario) se quiser as mudancas."
          fi
          if git diff --cached --quiet; then
            echo "Nada a mergear (fork ja em dia com upstream/main)."
          else
            git commit -q --no-edit -m "sync: merge upstream/main (workflows fork-owned)"
          fi

      - name: Push to fork
        run: git push origin main
