name: Sync fork with upstream

# Keeps this fork (davidamom/claude-seo) in sync with upstream
# (AgriciDaniel/claude-seo) automatically, preserving the fork's own commits.
# Runs daily; can also be triggered manually from the Actions tab.
# On a merge conflict the run fails and GitHub notifies you — resolve it locally.

on:
  schedule:
    - cron: '0 6 * * *'   # daily, 06:00 UTC (03:00 BRT)
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Register `merge=ours` driver (required by .gitattributes)
        # The driver is a security-sensitive setting that lives in local git
        # config (never in the committed tree). Without this, paths pinned in
        # .gitattributes via `merge=ours` fall back to the default 3-way
        # merge and conflicts on those paths fail the workflow.
        run: git config merge.ours.driver true

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/AgriciDaniel/claude-seo.git || true
          git fetch upstream

      - name: Merge upstream/main (preserving fork commits, workflows fork-owned)
        # GITHUB_TOKEN nunca pode criar/alterar arquivos de workflow no push
        # ("refusing to allow a GitHub App to ... without workflows permission").
        # Travou o sync de 20/07 a 17/08/2026 (upstream alterou ci.yml/v2.yml) e de
        # 27/08 a 28/09/2026 (upstream ADICIONOU windows-smoke.yml: o checkout de
        # origin/main restaura arquivos alterados, mas nao apaga arquivo novo, e o
        # merge commit ja continha o arquivo). Por isso o merge e feito SEM commit:
        # restaura os workflows do fork, remove os que o upstream adicionou e so
        # entao commita. Nenhum commit empurrado toca em .github/workflows.
        # Mudancas de workflow do upstream entram por merge manual (push de usuario).
        run: |
          git merge upstream/main --no-commit --no-edit
          git checkout origin/main -- .github/workflows/
          added=$(git diff --cached --name-only --diff-filter=A origin/main -- .github/workflows/)
          if [ -n "$added" ]; then
            echo "::warning::Upstream adicionou workflow(s) nao trazidos (fork-owned): $added"
            for f in $added; do git rm -q --cached -- "$f"; rm -f "$f"; done
          fi
          if ! git diff --quiet upstream/main -- .github/workflows/; then
            echo "::warning::Workflows do fork divergem do upstream; sincronize manualmente (git push de usuario) se quiser as mudancas."
          fi
          if git diff --cached --quiet; then
            echo "Nada a mergear (fork ja em dia com upstream/main)."
          else
            git commit -q --no-edit -m "sync: merge upstream/main (workflows fork-owned)"
          fi

      - name: Push to fork
        run: git push origin main
